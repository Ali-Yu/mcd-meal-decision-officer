<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麦M永存</title>
  <style>
    :root {
      --mcd-red: #DA291C;
      --mcd-yellow: #FFC72C;
      --mcd-dark: #1a1a1a;
      --mcd-light: #FFF8E7;
      --card-bg: #ffffff;
      --text: #333;
      --muted: #666;
      --border: #eee;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #fff8e7 0%, #ffe8c8 50%, #fff5e0 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .header {
      background: var(--mcd-red);
      color: white;
      padding: 32px 20px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: "";
      position: absolute;
      bottom: -30px;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--mcd-light);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }

    .logo {
      font-size: 13px;
      letter-spacing: 3px;
      opacity: 0.85;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 15px;
      opacity: 0.95;
      max-width: 480px;
      margin: 0 auto;
    }

    .highlight { color: var(--mcd-yellow); font-weight: 700; }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 16px 60px;
      position: relative;
      z-index: 10;
    }

    /* 表单卡片 */
    .form-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.1);
      padding: 28px 24px;
      margin-bottom: 28px;
      border: 1px solid rgba(0,0,0,0.04);
    }

    .form-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--mcd-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-title span {
      background: var(--mcd-yellow);
      color: var(--mcd-dark);
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--mcd-dark);
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .option {
      position: relative;
    }

    .option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .option span {
      display: inline-block;
      padding: 9px 18px;
      border: 2px solid #e8e8e8;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      background: #fafafa;
      user-select: none;
    }

    .option input:checked + span {
      background: var(--mcd-red);
      color: white;
      border-color: var(--mcd-red);
      box-shadow: 0 4px 12px rgba(218,41,28,0.25);
    }

    .option span:hover {
      border-color: var(--mcd-yellow);
    }

    .btn-generate {
      width: 100%;
      background: linear-gradient(90deg, var(--mcd-red), #c42318);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 6px 20px rgba(218,41,28,0.3);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(218,41,28,0.4);
    }

    .btn-generate:active {
      transform: translateY(0);
    }

    /* 结果区域 */
    .result {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .result.show { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      background: linear-gradient(90deg, var(--mcd-red), #c42318);
      color: white;
      padding: 16px 22px;
      border-radius: 16px 16px 0 0;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .result-header .meta {
      background: rgba(255,255,255,0.2);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .result-body {
      background: white;
      border-radius: 0 0 16px 16px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.04);
      border-top: none;
    }

    .plan {
      border: 1px solid #f0f0f0;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      transition: all 0.2s;
      position: relative;
    }

    .plan:hover {
      border-color: #ffd54f;
    }

    .plan.recommended {
      border: 2px solid var(--mcd-yellow);
      background: linear-gradient(to right, #fffdf5, #fff);
      box-shadow: 0 4px 16px rgba(255,199,44,0.2);
    }

    .plan.recommended::before {
      content: "最推荐";
      position: absolute;
      top: -1px;
      right: 18px;
      background: var(--mcd-yellow);
      color: var(--mcd-dark);
      font-size: 12px;
      font-weight: 800;
      padding: 3px 12px;
      border-radius: 0 0 10px 10px;
      letter-spacing: 0.5px;
    }

    .plan-title {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 10px;
      color: var(--mcd-red);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .plan-title .tag {
      font-size: 12px;
      background: #f5f5f5;
      color: #555;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
    }

    .plan-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .plan-meta strong { color: var(--mcd-red); }

    .reason {
      font-size: 13.5px;
      color: var(--muted);
      background: #fafafa;
      padding: 11px 14px;
      border-radius: 10px;
      border-left: 4px solid var(--mcd-yellow);
    }

    .decision-card {
      background: linear-gradient(135deg, #fff9e6, #fff3cc);
      border: 2px dashed var(--mcd-yellow);
      border-radius: 14px;
      padding: 18px 20px;
      margin-top: 18px;
    }

    .decision-card h3 {
      font-size: 15px;
      color: var(--mcd-dark);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .decision-card p {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .decision-card strong { color: var(--mcd-red); }

    .footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .footer a {
      color: var(--mcd-red);
      text-decoration: none;
      font-weight: 600;
    }

    .note {
      background: #fff8e7;
      border: 1px solid #ffe0a0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      color: #8a6d3b;
      margin-top: 20px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .header h1 { font-size: 22px; }
      .form-card { padding: 22px 18px; }
      .option span { padding: 8px 14px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">MCD MEAL DECISION OFFICER</div>
    <h1>麦麦饭点决策官</h1>
    <p>同一时间<span class="highlight">不同的决策<br>选好条件，立刻生成最符合你心意的方案</p>
  </div>

  <div class="container">
    <!-- 选择表单 -->
    <div class="form-card">
      <div class="form-title">
        告诉我你的饭点情况
        <span></span>
      </div>

      <div class="form-group">
        <label>⏰ 就餐时段</label>
        <div class="options">
          <label class="option"><input type="radio" name="time" value="lunch" checked><span>工作午餐</span></label>
          <label class="option"><input type="radio" name="time" value="tea"><span>下午茶</span></label>
          <label class="option"><input type="radio" name="time" value="dinner"><span>晚餐</span></label>
          <label class="option"><input type="radio" name="time" value="night"><span>加班宵夜</span></label>
          <label class="option"><input type="radio" name="time" value="weekend"><span>周末聚餐</span></label>
        </div>
      </div>

      <div class="form-group">
        <label>👥 用餐人数</label>
        <div class="options">
          <label class="option"><input type="radio" name="people" value="1" checked><span>1人</span></label>
          <label class="option"><input type="radio" name="people" value="2"><span>2人</span></label>
          <label class="option"><input type="radio" name="people" value="3"><span>3-4人</span></label>
          <label class="option"><input type="radio" name="people" value="3"><span>5人以上</span></label>
        </div>
      </div>

      <div class="form-group">
        <label>💰 预算</label>
        <div class="options">
          <label class="option"><input type="radio" name="budget" value="25"><span>≤25元</span></label>
          <label class="option"><input type="radio" name="budget" value="40" checked><span>≤40元</span></label>
          <label class="option"><input type="radio" name="budget" value="60"><span>≤60元</span></label>
          <label class="option"><input type="radio" name="budget" value="999"><span>不限</span></label>
        </div>
      </div>

      <div class="form-group">
        <label>🎯 特殊需求（可多选）</label>
        <div class="options">
          <label class="option"><input type="checkbox" name="need" value="lowcal"><span>控卡</span></label>
          <label class="option"><input type="checkbox" name="need" value="nospicy"><span>不吃辣</span></label>
          <label class="option"><input type="checkbox" name="need" value="new"><span>想吃新品</span></label>
          <label class="option"><input type="checkbox" name="need" value="none" checked><span>无特殊需求</span></label>
        </div>
      </div>

      <button class="btn-generate" onclick="generateDecision()">生成决策方案</button>
    </div>

    <!-- 结果区域 -->
    <div class="result" id="result">
      <div class="result-header">
        <span>【麦麦饭点决策】</span>
        <span class="meta" id="resultMeta">时段：工作午餐｜人数：1｜预算：≤40元</span>
      </div>
      <div class="result-body" id="resultBody">
        <!-- 动态填充 -->
      </div>
    </div>

    <div class="note">
      本页面为<strong>演示模式</strong>，方案基于真实 MCP 数据风格预设。<br>
      完整版请导入 skill/SKILL.md 到 WorkBuddy，连接你的麦当劳 MCP Token 使用真实数据。
    </div>
  </div>

  <div class="footer">
    <p>2026 麦当劳程序员创意开发大赛参赛作品 · 基于官方 MCP</p>
    <p style="margin-top:6px;"><a href="https://github.com/" target="_blank">GitHub 仓库</a></p>
  </div>

  <script>
    // 预设多套真实风格方案数据
    const plansDB = {
      // 工作午餐 + 1人 + 40元
      "lunch_1_40": {
        meta: "时段：工作午餐｜人数：1｜预算：≤40元",
        plans: [
          {
            title: "A. 最省方案",
            tag: "省钱优先",
            combo: "麦香鸡 + 中薯条 + 中可乐",
            price: "¥24.5（原价¥32）",
            cal: "780 kcal",
            reason: "工作午餐优先性价比，经典组合快速解决饥饿，放弃了更高蛋白的板烧以控制预算。"
          },
          {
            title: "B. 最均衡方案",
            tag: "推荐",
            combo: "板烧鸡腿堡套餐（可乐换无糖）",
            price: "¥32.0",
            cal: "690 kcal",
            reason: "兼顾饱腹与下午不困，无糖可乐降低糖分负担，适合工作日中午持续精力。",
            recommend: true
          },
          {
            title: "C. 最开心方案",
            tag: "满足优先",
            combo: "麦辣鸡腿堡 + 麦乐鸡5块 + 中可乐",
            price: "¥34.5",
            cal: "920 kcal",
            reason: "重口解压，适合压力大的工作日中午，但热量偏高，下午可能犯困。"
          }
        ],
        card: {
          goal: "饱腹 + 下午不困",
          suggest: "选 B，因为工作午餐更看重持续精力而非极致省钱或重口刺激",
          tradeoff: "放弃了最便宜的组合，换来更低的糖分负担和更好的下午状态"
        }
      },

      // 加班宵夜 + 1人 + 40元
      "night_1_40": {
        meta: "时段：加班宵夜｜人数：1｜预算：≤40元",
        plans: [
          {
            title: "A. 最省方案",
            tag: "省钱优先",
            combo: "麦香鸡 + 小份薯条",
            price: "¥18.5",
            cal: "520 kcal",
            reason: "宵夜时段优先低负担，放弃饮料和多余小食，快速垫一下即可。"
          },
          {
            title: "B. 最均衡方案",
            tag: "推荐",
            combo: "板烧鸡腿堡（去酱）+ 玉米杯",
            price: "¥29.0",
            cal: "480 kcal",
            reason: "宵夜核心是「不撑」，去酱降低油脂，玉米提供饱腹感且易消化。",
            recommend: true
          },
          {
            title: "C. 最开心方案",
            tag: "满足优先",
            combo: "麦辣鸡腿堡 + 麦旋风",
            price: "¥38.5",
            cal: "890 kcal",
            reason: "加班后想吃点甜的奖励自己，但热量较高，仅建议偶尔选择。"
          }
        ],
        card: {
          goal: "低负担不撑",
          suggest: "选 B，因为宵夜更看重消化负担而非极致省钱或情绪满足",
          tradeoff: "放弃了最便宜和最解压的组合，换来更低的夜间负担感"
        }
      },

      // 周末聚餐 + 3人 + 60元
      "weekend_3_60": {
        meta: "时段：周末聚餐｜人数：3-4人｜人均预算：≤50元",
        plans: [
          {
            title: "A. 最省方案",
            tag: "省钱优先",
            combo: "3份麦香鸡套餐 + 共享薯条",
            price: "合计¥89（人均≈¥29.7）",
            cal: "总热量约2100 kcal",
            reason: "极致控制预算，但口味单一，且未照顾控卡和不吃辣的朋友。"
          },
          {
            title: "B. 最均衡方案",
            tag: "推荐",
            combo: "板烧鸡腿堡套餐×1 + 麦辣鸡腿堡套餐×1 + 麦香鱼套餐×1（无糖）",
            price: "合计¥128（人均≈¥42.7）",
            cal: "总热量约1950 kcal",
            reason: "一人一份不同主食，覆盖不吃辣与控卡需求，口味有差异但不踩雷，公平性最高。",
            recommend: true
          },
          {
            title: "C. 最开心方案",
            tag: "满足优先",
            combo: "新品鸡腿堡×2 + 麦辣鸡翅 + 麦旋风×2 + 共享小食",
            price: "合计¥148（人均≈¥49.3）",
            cal: "总热量约2400 kcal",
            reason: "氛围感拉满，适合庆祝或放松聚餐，但预算接近上限且热量偏高。"
          }
        ],
        card: {
          goal: "公平 + 不踩雷 + 人均可控",
          suggest: "选 B，因为聚餐最重要的是每个人都能接受，而不是某一个人最开心",
          tradeoff: "放弃了最便宜和最热闹的组合，换来更高的公平性和更低的踩雷风险"
        }
      },

      // 预算紧张
      "tea_1_25": {
        meta: "时段：下午茶｜人数：1｜预算：≤25元",
        plans: [
          {
            title: "A. 最省方案",
            tag: "推荐",
            combo: "麦香鸡 + 小份薯条",
            price: "¥18.5",
            cal: "520 kcal",
            reason: "预算极紧时优先解决饥饿感，经典组合性价比最高，放弃饮料以留足空间。",
            recommend: true
          },
          {
            title: "B. 最均衡方案",
            tag: "平衡",
            combo: "麦香鱼 + 玉米杯",
            price: "¥22.0",
            cal: "410 kcal",
            reason: "在预算内尽量控制热量，玉米提供额外饱腹，适合下午不想吃太撑的场景。"
          },
          {
            title: "C. 最开心方案",
            tag: "满足优先",
            combo: "麦辣鸡翅4块 + 中可乐",
            price: "¥24.5",
            cal: "480 kcal",
            reason: "重口解馋，预算几乎用满，适合特别想吃辣的时候。"
          }
        ],
        card: {
          goal: "解决饥饿 + 严格控预算",
          suggest: "选 A，因为预算只有25元时，性价比是第一优先级",
          tradeoff: "放弃了更多选择空间，换来确定能吃饱且不超支"
        }
      },

      // 默认兜底
      "default": {
        meta: "时段：通用｜人数：1｜预算：≤40元",
        plans: [
          {
            title: "A. 最省方案",
            tag: "省钱优先",
            combo: "麦香鸡堡 + 中薯条",
            price: "¥22.0",
            cal: "650 kcal",
            reason: "经典高性价比组合，快速解决基本需求。"
          },
          {
            title: "B. 最均衡方案",
            tag: "推荐",
            combo: "板烧鸡腿堡套餐（无糖可乐）",
            price: "¥32.0",
            cal: "690 kcal",
            reason: "营养与口味平衡，适合大多数日常场景。",
            recommend: true
          },
          {
            title: "C. 最开心方案",
            tag: "满足优先",
            combo: "麦辣鸡腿堡 + 麦乐鸡 + 可乐",
            price: "¥36.5",
            cal: "880 kcal",
            reason: "重口满足，适合想吃得过瘾的时候。"
          }
        ],
        card: {
          goal: "日常均衡",
          suggest: "选 B，平衡性价比与满意度",
          tradeoff: "在省钱与满足之间取了中间值"
        }
      }
    };

    // 根据选择匹配方案
    function getKey(time, people, budget) {
      if (time === "night" && people === "1") return "night_1_40";
      if (time === "weekend" && (people === "3" || people === "2")) return "weekend_3_60";
      if (budget === "25") return "tea_1_25";
      if (time === "lunch") return "lunch_1_40";
      return "default";
    }

    function generateDecision() {
      const time = document.querySelector('input[name="time"]:checked').value;
      const people = document.querySelector('input[name="people"]:checked').value;
      const budget = document.querySelector('input[name="budget"]:checked').value;

      // 处理「无特殊需求」与其他互斥
      const needs = Array.from(document.querySelectorAll('input[name="need"]:checked')).map(i => i.value);

      const key = getKey(time, people, budget);
      const data = plansDB[key] || plansDB["default"];

      // 更新 meta
      document.getElementById("resultMeta").textContent = data.meta;

      // 生成方案 HTML
      let html = "";
      data.plans.forEach(p => {
        html += `
          <div class="plan ${p.recommend ? "recommended" : ""}">
            <div class="plan-title">${p.title} <span class="tag">${p.tag}</span></div>
            <div class="plan-meta">
              <div>组合：${p.combo}</div>
              <div>实付 <strong>${p.price}</strong></div>
              <div>热量 <strong>${p.cal}</strong></div>
            </div>
            <div class="reason">决策理由：${p.reason}</div>
          </div>
        `;
      });

      html += `
        <div class="decision-card">
          <h3>📋 决策卡片（可直接转发）</h3>
          <p><strong>时段目标：</strong>${data.card.goal}</p>
          <p><strong>最终建议：</strong>${data.card.suggest}</p>
          <p><strong>取舍说明：</strong>${data.card.tradeoff}</p>
        </div>
      `;

      document.getElementById("resultBody").innerHTML = html;
      const resultEl = document.getElementById("result");
      resultEl.classList.add("show");
      resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // 「无特殊需求」与其他选项互斥
    document.querySelectorAll('input[name="need"]').forEach(input => {
      input.addEventListener("change", function() {
        if (this.value === "none" && this.checked) {
          document.querySelectorAll('input[name="need"]').forEach(i => {
            if (i.value !== "none") i.checked = false;
          });
        } else if (this.checked) {
          document.querySelector('input[name="need"][value="none"]').checked = false;
        }
      });
    });
  </script>
</body>
</html>
